name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Normal lifecycle install: the pinned moxml-ts git dependency builds in its prepare script.
      - run: npm ci
      - run: npm run check:artifacts
      - run: npm test
      - run: npm run check:package
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lutaml/lutaml-ts
          ref: 1242c7b6314dcadc42e3453e85c9f2fc879cd7ef
          path: .build/lutaml-ts-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate -- .build/lutaml-ts-source
      - run: git diff --exit-code -- src/v3 src/v4 src/upstream model/codegen-provenance.json
